seed: 0
image_size: 512
dep_scale: 0.1          # synthetic metres -> normalized units (relative, NOT calibrated)
model: {channels: [24, 48, 96, 160, 256]}
train_samples: 2000     # fresh synthetic samples per epoch (seed-shifted each epoch)
val_samples: 200
epochs: 3
batch_size: 8
workers: 4
lr: 0.002
weight_decay: 0.0001
amp: true
grad_clip: 1.0
patience: 8
out_dir: outputs/run1
loss: {w_seg: 1.0, w_dep: 1.0, w_unc: 0.1, w_reg: 0.05, pos_weight: 3.0, dep_pothole_weight: 4.0, huber_delta: 0.5}
